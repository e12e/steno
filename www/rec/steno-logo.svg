<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Steno — Automaton Stenographer Seal (1843)">
  <defs>
    <style>
      :root {
        color-scheme: light dark;
        --steno-bg: #fbfaf6;
        --steno-ink: #181816;
        --steno-brass: #6e5223;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --steno-bg: #0b0e15;
          --steno-ink: #e6e0d4;
          --steno-brass: #d4b87a;
        }
      }
      .bg { fill: var(--steno-bg); stroke: none; }
      .ink { stroke: var(--steno-ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fill { fill: var(--steno-ink); stroke: none; }
      .brass { stroke: var(--steno-brass); fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .brass-fill { fill: var(--steno-brass); stroke: none; }
      .serif-s {
        font-family: "Georgia", "Baskerville", "Times New Roman", serif;
        font-weight: 700;
        font-style: italic;
        font-size: 242px;
        fill: var(--steno-ink);
      }
      .seal-label {
        font-family: "Georgia", "Baskerville", "Times New Roman", serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.26em;
        fill: var(--steno-brass);
      }
    </style>
  </defs>
  <!-- Medallion Background Disk -->
  <circle cx="256" cy="256" r="246" class="bg"/>

