  <!-- III-C Vertical Stylus Terminations -->
  <line x1="256" y1="78" x2="256" y2="120" class="brass" stroke-width="3.5"/>
  <line x1="256" y1="392" x2="256" y2="434" class="brass" stroke-width="3.5"/>
  <polygon points="256,64 242,96 270,96" class="brass-fill"/>
  <polygon points="256,448 242,416 270,416" class="brass-fill"/>

  <!-- III-C Lateral Acoustic Signal Wave -->
  <path d="M 92 256 L 114 256 L 123 236 L 134 276 L 145 222 L 156 288 L 167 244 L 175 256 L 188 256"
        class="brass" stroke-width="2.8"/>
  <path d="M 324 256 L 337 256 L 345 244 L 356 288 L 367 222 L 378 276 L 389 236 L 398 256 L 420 256"
        class="brass" stroke-width="2.8"/>

  <!-- III-C Central Monogram & Labels (Explicit px font-size in inline style) -->
  <text x="258" y="148" text-anchor="middle" class="seal-label" style="font-family:Georgia,Baskerville,'Times New Roman',serif;font-weight:700;font-size:20px;letter-spacing:0.26em;">STENO</text>
  <text x="252" y="338" text-anchor="middle" class="serif-s" style="font-family:Georgia,Baskerville,'Times New Roman',serif;font-weight:700;font-style:italic;font-size:242px;">S</text>
