[project]
name = "mote-transcribe"
version = "0.2.0"
description = "100% lokal norsk møtetranskripsjon, taler-separasjon (WhisperX + Pyannote) og referat/foredragsnotater (Ollama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.3",
    "markdown>=3.5",
    "static-ffmpeg>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
mote-cli = "mote_core:cli_main"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = [
    "mote_core.py",
    "transcribe.py",
    "tests",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/mote/core.py", "src/mote/cli.py", "transcribe.py", "tests/test_cli_and_pipeline.py"]
