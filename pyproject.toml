[project]
name = "steno"
version = "0.3.0"
description = "Steno - a modern annalist for your meetings - an automaton stenographer."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "e12e", email = "steno@s.hypertekst.net" }]
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.3",
    "markdown>=3.5",
    "static-ffmpeg>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
steno = "mote.gui:entrypoint"
mote-cli = "mote.core:cli_main"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = ["src", "."]
testpaths = [
    "src/mote",
    "transcribe.py",
    "tests/test_cli_and_pipeline.py",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
files = [
    "src/mote",
    "scripts/build_single_file.py",
    "transcribe.py",
    "steno.py",
    "tests/test_cli_and_pipeline.py",
]
