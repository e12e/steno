<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{escaped_title} – Transkripsjon</title>
  <style>
    :root {{
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --header-bg: rgba(255, 255, 255, 0.92);
      --badge-border: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.08), 0 2px 6px -2px rgba(0,0,0,0.04);
    }}
    [data-theme="dark"] {{
      --bg: #0b0f19;
      --card-bg: #151d2e;
      --card-border: #233047;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --header-bg: rgba(21, 29, 46, 0.94);
      --badge-border: rgba(255, 255, 255, 0.12);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.45);
    }}
    @media (prefers-color-scheme: dark) {{
      :root:not([data-theme="light"]) {{
        --bg: #0b0f19;
        --card-bg: #151d2e;
        --card-border: #233047;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.12);
        --header-bg: rgba(21, 29, 46, 0.94);
        --badge-border: rgba(255, 255, 255, 0.12);
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 16px rgba(0,0,0,0.45);
      }}
    }}
    * {{ box-sizing: border-box; }}
    body {{
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 80px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }}
    header.sticky-header {{
      background: var(--header-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 18px;
      position: sticky;
      top: 10px;
      z-index: 100;
      box-shadow: var(--shadow-md);
    }}
    .header-top {{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }}
    .title-group {{
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }}
    .title-group h1 {{
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }}
    .stats-bar {{
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      align-items: center;
    }}
    .stat-pill {{
      background: var(--accent-soft);
      color: var(--accent);
      padding: 1px 8px;
      border-radius: 999px;
      font-weight: 600;
    }}
    .header-actions {{
      display: flex;
      align-items: center;
      gap: 6px;
    }}
    .btn {{
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }}
    .btn:hover {{
      border-color: var(--accent);
      color: var(--accent);
    }}
    .search-row {{
      display: flex;
      align-items: center;
      gap: 8px;
    }}
    .search-wrap {{
      flex: 1;
      position: relative;
    }}
    #filter {{
      width: 100%;
      padding: 7px 30px 7px 11px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      transition: border-color 0.15s ease;
    }}
    #filter:focus {{
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }}
    #filter-clear {{
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      display: none;
    }}
    #match-count {{
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      text-align: right;
    }}
    .controls-bar {{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--card-border);
      flex-wrap: wrap;
    }}
    .filter-pills-row {{
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      flex: 1;
      min-width: 0;
    }}
    .filter-pills-label {{
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-right: 2px;
      flex-shrink: 0;
    }}
    .spk-filter-btn {{
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }}
    .spk-filter-btn:hover {{
      border-color: var(--accent);
      color: var(--text-main);
    }}
    .spk-filter-btn.active {{
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }}
    .spk-filter-btn.active .dot {{
      border: 1.5px solid #ffffff;
    }}
    details.speakers-drawer {{
      margin-top: 6px;
    }}
    details.speakers-drawer summary {{
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      font-weight: 500;
    }}
    details.speakers-drawer summary:hover {{
      color: var(--accent);
    }}
    .reset-link {{
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      margin-left: 8px;
    }}
    .reset-link:hover {{
      text-decoration: underline;
    }}
    .speakers-list {{
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--card-border);
    }}
    .spk-edit {{
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 2px 7px;
      border-radius: 7px;
    }}
    .dot {{
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }}
    .spk-edit input {{
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 600;
      width: 145px;
      padding: 2px 0;
    }}
    .spk-edit input:focus {{
      outline: none;
    }}
    .turns-list {{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }}
    .turn {{
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 13px 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease, border-color 0.15s ease;
    }}
    .turn:hover {{
      border-color: var(--accent);
    }}
    .meta {{
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      flex-wrap: wrap;
    }}
    .badge {{
      color: #ffffff;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      letter-spacing: 0.01em;
      border: 1px solid var(--badge-border);
      display: inline-block;
      font-size: 11.5px;
    }}
    .timestamp {{
      color: var(--text-muted);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
    }}
    .copy-turn-btn {{
      margin-left: auto;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0.65;
      transition: all 0.15s ease;
    }}
    .turn:hover .copy-turn-btn {{
      opacity: 1;
    }}
    .copy-turn-btn:hover {{
      border-color: var(--accent);
      color: var(--accent);
    }}
    .text {{
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-main);
    }}
    @media (max-width: 680px) {{
      body {{
        padding: 10px 10px 60px;
      }}
      header.sticky-header {{
        position: static;
        padding: 10px 12px;
        margin-bottom: 12px;
        border-radius: 11px;
      }}
      .header-top {{
        margin-bottom: 8px;
        gap: 8px;
      }}
      .title-group h1 {{
        font-size: 1.05rem;
      }}
      .btn {{
        padding: 4px 8px;
        font-size: 11px;
      }}
      .filter-pills-row {{
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
        scrollbar-width: none;
      }}
      .filter-pills-row::-webkit-scrollbar {{
        display: none;
      }}
      .turn {{
        padding: 10px 12px;
        border-radius: 10px;
      }}
      .text {{
        font-size: 14px;
      }}
    }}
    @media print {{
      body {{ background: #fff !important; color: #000 !important; padding: 0 !important; max-width: 100% !important; }}
      .no-print, header.sticky-header {{ display: none !important; }}
      .turn {{ border: none !important; border-bottom: 1px solid #e2e8f0 !important; border-radius: 0 !important; box-shadow: none !important; padding: 10px 0 !important; break-inside: avoid; }}
      .badge {{ color: #000 !important; background: #eee !important; border: 1px solid #ccc !important; }}
      .timestamp {{ color: #555 !important; }}
    }}
  </style>
</head>
<body>
  <header class="sticky-header">
    <div class="header-top">
      <div class="title-group">
        <h1>{escaped_title}</h1>
        <div class="stats-bar">
          <span class="stat-pill">{total_turns} innlegg</span>
          <span class="stat-pill">{speaker_count} deltakere</span>
          <span>{total_duration_str}</span>
        </div>
      </div>
      <div class="header-actions no-print">
        <button class="btn" onclick="copyFullTranscript()" id="copy-all-btn" title="Kopier hele transkripsjonen som ren tekst">
          📋 Kopier
        </button>
        <button class="btn" onclick="toggleTheme()" title="Bytt mellom lyst og mørkt tema">
          🌓 Tema
        </button>
        <button class="btn" onclick="window.print()" title="Skriv ut eller lagre PDF">
          🖨️ PDF
        </button>
      </div>
    </div>

    <div class="search-row no-print">
      <div class="search-wrap">
        <input type="text" id="filter" placeholder="Søk i tekst, tidspunkt eller navn..." oninput="onSearchInput()">
        <button id="filter-clear" onclick="clearSearch()" title="Tøm søk">&times;</button>
      </div>
      <div id="match-count">{total_turns} innlegg</div>
    </div>

    <div class="controls-bar no-print">
      <div class="filter-pills-row">
        <span class="filter-pills-label">Taler:</span>
        <button class="spk-filter-btn active" data-spk="ALL" onclick="filterBySpeaker('ALL')">Alle</button>
        {speaker_filters}
      </div>
    </div>

    <details class="speakers-drawer no-print">
      <summary>
        <span>✏️ Rediger deltakernavn ({speaker_count})</span>
        <span class="reset-link" onclick="event.preventDefault(); event.stopPropagation(); resetSpeakerNames();">Tilbakestill</span>
      </summary>
      <div class="speakers-list">
        {speaker_inputs}
      </div>
    </details>
  </header>

  <main class="turns-list" id="container">
    {html_items}
  </main>

  <script>
    const STORAGE_KEY = "mote_spk_" + document.title;
    const THEME_KEY = "mote_theme_pref";
    let activeSpeakerFilter = "ALL";

    function getSearchQuery() {{
      return (document.getElementById('filter').value || '').trim().toLowerCase();
    }}

    function onSearchInput() {{
      const q = getSearchQuery();
      document.getElementById('filter-clear').style.display = q ? 'block' : 'none';
      applyFilters();
    }}

    function clearSearch() {{
      document.getElementById('filter').value = '';
      document.getElementById('filter-clear').style.display = 'none';
      applyFilters();
    }}

    function filterBySpeaker(spk) {{
      activeSpeakerFilter = spk;
      document.querySelectorAll('.spk-filter-btn').forEach(btn => {{
        btn.classList.toggle('active', btn.dataset.spk === spk);
      }});
      applyFilters();
    }}

    function applyFilters() {{
      const q = getSearchQuery();
      const turns = document.querySelectorAll('.turn');
      let visibleCount = 0;

      turns.forEach(el => {{
        const matchesSpeaker = (activeSpeakerFilter === 'ALL' || el.dataset.speaker === activeSpeakerFilter);
        const matchesText = !q || el.innerText.toLowerCase().includes(q);
        const show = matchesSpeaker && matchesText;
        el.style.display = show ? '' : 'none';
        if (show) visibleCount++;
      }});

      document.getElementById('match-count').textContent = `${{visibleCount}} / ${{turns.length}}`;
    }}

    function renameSpeaker(orig, newName, skipSave) {{
      const label = newName.trim() || orig;
      document.querySelectorAll(`[data-spk-label="${{orig}}"]`).forEach(el => {{
        el.textContent = label;
      }});
      document.querySelectorAll(`[data-spk-btn-label="${{orig}}"]`).forEach(el => {{
        el.textContent = label;
      }});
      if (!skipSave) {{
        try {{
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{{}}");
          saved[orig] = newName;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        }} catch (e) {{}}
      }}
      applyFilters();
    }}

    function resetSpeakerNames() {{
      try {{
        localStorage.removeItem(STORAGE_KEY);
      }} catch (e) {{}}
      document.querySelectorAll('.spk-edit input').forEach(inp => {{
        inp.value = inp.dataset.orig;
        renameSpeaker(inp.dataset.orig, inp.dataset.orig, true);
      }});
    }}

    function copyTurnText(id) {{
      const el = document.getElementById(id);
      if (!el) return;
      const text = el.querySelector('.text').innerText;
      const meta = el.querySelector('.meta').innerText.replace('Kopier', '').trim();
      navigator.clipboard.writeText(`[${{meta}}]\n${{text}}`).then(() => {{
        const btn = el.querySelector('.copy-turn-btn');
        if (btn) {{
          const old = btn.textContent;
          btn.textContent = "Kopiert!";
          setTimeout(() => {{ btn.textContent = old; }}, 1200);
        }}
      }});
    }}

    function copyFullTranscript() {{
      const turns = Array.from(document.querySelectorAll('.turn'))
        .filter(el => el.style.display !== 'none')
        .map(el => {{
          const meta = el.querySelector('.badge').textContent + ' (' + el.querySelector('.timestamp').textContent + ')';
          const txt = el.querySelector('.text').innerText;
          return `${{meta}}:\n${{txt}}`;
        }}).join('\\n\\n');

      navigator.clipboard.writeText(turns).then(() => {{
        const btn = document.getElementById('copy-all-btn');
        const old = btn.textContent;
        btn.textContent = "✓ Kopiert!";
        setTimeout(() => {{ btn.textContent = old; }}, 1500);
      }});
    }}

    function toggleTheme() {{
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {{ localStorage.setItem(THEME_KEY, next); }} catch (e) {{}}
    }}

    window.addEventListener('DOMContentLoaded', () => {{
      try {{
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme) {{
          document.documentElement.setAttribute('data-theme', savedTheme);
        }}
      }} catch (e) {{}}

      try {{
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{{}}");
        document.querySelectorAll('.spk-edit input').forEach(inp => {{
          const orig = inp.dataset.orig;
          if (saved[orig]) {{
            inp.value = saved[orig];
            renameSpeaker(orig, saved[orig], true);
          }}
        }});
      }} catch (e) {{}}
      applyFilters();
    }});
  </script>
</body>
</html>
